<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Life 3D</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1d4b63, #0b1726 42%, #050d15 100%);
      color: #edf8ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #game {
      width: min(920px, 96vw);
      background: rgba(13, 23, 38, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px 18px 14px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.42);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: clamp(1.2rem, 2vw, 2rem);
    }

    .right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 100px;
      padding: 8px 12px;
      text-align: center;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .label {
      display: block;
      color: #bdd3e8;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .value {
      display: block;
      margin-top: 4px;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .undo-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .tool {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: white;
      padding: 10px 8px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .tool.active {
      background: rgba(110, 224, 255, 0.18);
      border-color: rgba(110, 224, 255, 0.65);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      background: linear-gradient(180deg, #376c7d 0%, #244c63 100%);
      border: 1px solid rgba(255,255,255,0.08);
    }

    #msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(144, 227, 165, 0.08);
      border: 1px solid rgba(144, 227, 165, 0.2);
      color: #aef0b3;
      min-height: 42px;
    }

    @media (max-width: 680px) {
      .top { flex-direction: column; align-items: flex-start; }
      .right { width: 100%; justify-content: space-between; }
      .tools { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="top">
      <h1>Block Life 3D</h1>
      <div class="right">
        <button id="undoBtn" class="undo-btn" type="button">Undo</button>
        <div class="stat">
          <span class="label">Money</span>
          <span class="value" id="money">$0</span>
        </div>
        <div class="stat">
          <span class="label">Rate</span>
          <span class="value" id="rate">$0/s</span>
        </div>
        <div class="stat">
          <span class="label">Upgrade</span>
          <span class="value" id="upgrade">$3</span>
        </div>
        <div class="stat">
          <span class="label">Day</span>
          <span class="value" id="day">1</span>
        </div>
      </div>
    </div>

    <div class="tools">
      <button class="tool active" data-type="house">House</button>
      <button class="tool" data-type="shop">Shop</button>
      <button class="tool" data-type="tree">Tree</button>
      <button class="tool" data-type="road">Road</button>
      <button class="tool" data-type="wall">Wall</button>
    </div>

    <canvas id="canvas" width="820" height="500"></canvas>
    <div id="msg">WASD to move. Press E near the lemonade stand. Click a tile to place a block. Right-click to erase.</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const dayEl = document.getElementById('day');
    const moneyEl = document.getElementById('money');
    const rateEl = document.getElementById('rate');
    const upgradeEl = document.getElementById('upgrade');
    const msgEl = document.getElementById('msg');
    const undoBtn = document.getElementById('undoBtn');

    const SIZE = 80;
    const TILE_W = 62;
    const TILE_H = 32;
    const ORIGIN_X = 300;
    const ORIGIN_Y = 120;
    const BASE_COLORS = {
      house: '#f4d39a',
      shop: '#f7b267',
      tree: '#6ed26d',
      road: '#a1a9b2',
      wall: '#c7ced9',
      stand: '#ffe29a'
    };

    const stand = { x: 12, y: 10 };

    const state = {
      day: 1,
      x: 4,
      y: 4,
      selected: 'house',
      blocks: Array(SIZE * SIZE).fill(null),
      hover: null,
      history: [],
      audioCtx: null,
      lastStep: 0,
      money: 0,
      standLevel: 0,
      inStand: false,
      cameraX: 0,
      cameraY: 0
    };

    function idx(x, y) {
      return y * SIZE + x;
    }

    function ok(x, y) {
      return x >= 0 && y >= 0 && x < SIZE && y < SIZE;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getMoneyRate() {
      return Math.min(1000, 1 + state.standLevel);
    }

    function getUpgradeCost() {
      return Math.min(1002, 3 + state.standLevel * 3);
    }

    function setMessage(text) {
      msgEl.textContent = text;
    }

    function cloneState() {
      return {
        day: state.day,
        x: state.x,
        y: state.y,
        selected: state.selected,
        blocks: state.blocks.map((block) => block ? { ...block } : null),
        hover: state.hover ? { ...state.hover } : null,
        money: state.money,
        standLevel: state.standLevel,
        inStand: state.inStand
      };
    }

    function pushHistory() {
      state.history.push(cloneState());
      if (state.history.length > 30) {
        state.history.shift();
      }
    }

    function undo() {
      if (!state.history.length) {
        setMessage('Nothing to undo yet.');
        return;
      }
      const prev = state.history.pop();
      state.day = prev.day;
      state.x = prev.x;
      state.y = prev.y;
      state.selected = prev.selected;
      state.blocks = prev.blocks;
      state.hover = prev.hover;
      state.money = prev.money;
      state.standLevel = prev.standLevel;
      state.inStand = prev.inStand;
      setMessage('Last move undone.');
      updateCamera();
      render();
    }

    function worldToScreen(x, y) {
      const localX = x - state.cameraX;
      const localY = y - state.cameraY;
      return {
        x: ORIGIN_X + (localX - localY) * (TILE_W / 2),
        y: ORIGIN_Y + (localX + localY) * (TILE_H / 2)
      };
    }

    function shade(hex, factor) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      const r = Math.min(255, Math.max(0, ((num >> 16) & 255) * factor));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 255) * factor));
      const b = Math.min(255, Math.max(0, (num & 255) * factor));
      return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
    }

    function updateStats() {
      moneyEl.textContent = `$${Math.floor(state.money)}`;
      rateEl.textContent = `$${getMoneyRate()}/s`;
      upgradeEl.textContent = `$${getUpgradeCost()}`;
      dayEl.textContent = state.day;
    }

    function updateCamera() {
      const viewW = 15;
      const viewH = 10;
      state.cameraX = clamp(state.x - Math.floor(viewW / 2), 0, SIZE - viewW);
      state.cameraY = clamp(state.y - Math.floor(viewH / 2), 0, SIZE - viewH);
    }

    function drawGround(x, y) {
      const p = worldToScreen(x, y);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + TILE_W / 2, p.y + TILE_H / 2);
      ctx.lineTo(p.x, p.y + TILE_H);
      ctx.lineTo(p.x - TILE_W / 2, p.y + TILE_H / 2);
      ctx.closePath();
      ctx.fillStyle = '#3f8763';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.stroke();
    }

    function drawBlock(x, y, type) {
      const p = worldToScreen(x, y);
      const base = BASE_COLORS[type] || '#ebebeb';
      const top = { x: p.x, y: p.y - 10 };
      const right = { x: p.x + TILE_W / 2, y: p.y + TILE_H / 2 - 10 };
      const left = { x: p.x - TILE_W / 2, y: p.y + TILE_H / 2 - 10 };
      const bottom = { x: p.x, y: p.y + TILE_H - 10 };

      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(right.x, right.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(left.x, left.y);
      ctx.closePath();
      ctx.fillStyle = shade(base, 0.75);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(top.x, top.y);
      ctx.lineTo(p.x + TILE_W / 2, p.y + TILE_H / 2);
      ctx.lineTo(p.x, p.y + TILE_H);
      ctx.lineTo(p.x - TILE_W / 2, p.y + TILE_H / 2);
      ctx.closePath();
      ctx.fillStyle = base;
      ctx.fill();

      if (type === 'tree') {
        ctx.fillStyle = '#2c7c3c';
        ctx.beginPath();
        ctx.arc(p.x, p.y - 18, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5a3d2a';
        ctx.fillRect(p.x - 4, p.y - 2, 8, 18);
      }

      if (type === 'house') {
        ctx.fillStyle = '#b98151';
        ctx.fillRect(p.x - 12, p.y + 2, 24, 16);
        ctx.fillStyle = '#f7dba8';
        ctx.fillRect(p.x - 5, p.y - 8, 10, 12);
      }

      if (type === 'shop') {
        ctx.fillStyle = '#b98151';
        ctx.fillRect(p.x - 14, p.y + 3, 28, 18);
        ctx.fillStyle = '#f3d699';
        ctx.fillRect(p.x - 12, p.y - 10, 24, 10);
      }

      if (type === 'wall') {
        ctx.fillStyle = '#d7dde5';
        ctx.fillRect(p.x - 12, p.y - 2, 24, 20);
      }

      if (type === 'road') {
        ctx.strokeStyle = '#edf2f7';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x - 10, p.y + 8);
        ctx.lineTo(p.x + 10, p.y + 8);
        ctx.moveTo(p.x, p.y - 8);
        ctx.lineTo(p.x, p.y + 16);
        ctx.stroke();
      }

      if (type === 'stand') {
        ctx.fillStyle = '#8a5d1e';
        ctx.fillRect(p.x - 18, p.y + 4, 36, 16);
        ctx.fillStyle = '#fff4b5';
        ctx.fillRect(p.x - 12, p.y - 10, 24, 12);
        ctx.fillStyle = '#4a2b10';
        ctx.fillRect(p.x - 3, p.y - 20, 6, 14);
      }
    }

    function drawPlayer() {
      const p = worldToScreen(state.x, state.y);
      ctx.fillStyle = '#edf4ff';
      ctx.fillRect(p.x - 7, p.y - 12, 14, 14);
      ctx.fillStyle = '#2a3d5a';
      ctx.fillRect(p.x - 5, p.y + 2, 10, 10);
    }

    function drawStandMarker() {
      const p = worldToScreen(stand.x, stand.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 22, p.y - 22, 44, 42);
    }

    function drawHover() {
      if (!state.hover) return;
      const p = worldToScreen(state.hover.x, state.hover.y);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 22, p.y - 18, 42, 36);
    }

    function render() {
      updateStats();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const minX = state.cameraX;
      const minY = state.cameraY;
      const maxX = Math.min(SIZE - 1, state.cameraX + 15);
      const maxY = Math.min(SIZE - 1, state.cameraY + 10);

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          drawGround(x, y);
          const block = state.blocks[idx(x, y)];
          if (block) drawBlock(x, y, block.type);
        }
      }

      const standTile = idx(stand.x, stand.y);
      drawBlock(stand.x, stand.y, 'stand');
      state.blocks[standTile] = { type: 'stand' };

      drawPlayer();
      drawStandMarker();
      drawHover();
    }

    function screenToTile(x, y) {
      const relX = x - ORIGIN_X;
      const relY = y - ORIGIN_Y;
      const gx = (relX / (TILE_W / 2) + relY / (TILE_H / 2)) / 2 + state.cameraX;
      const gy = (relY / (TILE_H / 2) - relX / (TILE_W / 2)) / 2 + state.cameraY;
      const tx = Math.round(gx);
      const ty = Math.round(gy);
      if (!ok(tx, ty)) return null;
      return { x: tx, y: ty };
    }

    function playFootstep() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!state.audioCtx) {
        state.audioCtx = new AudioCtx();
      }

      const ctxAudio = state.audioCtx;
      if (ctxAudio.state === 'suspended') {
        ctxAudio.resume();
      }

      const oscillator = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      oscillator.type = 'triangle';
      oscillator.frequency.value = 90;
      gain.gain.value = 0.035;
      oscillator.connect(gain);
      gain.connect(ctxAudio.destination);
      oscillator.start();
      oscillator.stop(ctxAudio.currentTime + 0.05);
    }

    function nearStand() {
      return Math.abs(state.x - stand.x) <= 1 && Math.abs(state.y - stand.y) <= 1;
    }

    function enterStand() {
      if (!nearStand()) {
        setMessage('Walk to the lemonade stand and press E.');
        return;
      }

      state.inStand = !state.inStand;
      if (state.inStand) {
        setMessage('Inside the lemonade stand. You are making money!');
      } else {
        setMessage('You left the stand.');
      }
      render();
    }

    function buyUpgrade() {
      const cost = getUpgradeCost();
      if (state.money < cost) {
        setMessage(`You need $${cost} to upgrade the lemonade stand.`);
        return;
      }

      state.money -= cost;
      state.standLevel += 1;
      setMessage(`Stand upgraded to level ${state.standLevel}. You now earn $${getMoneyRate()}/s.`);
      render();
    }

    function move(dx, dy) {
      const nx = state.x + dx;
      const ny = state.y + dy;
      if (!ok(nx, ny)) return;

      const tile = state.blocks[idx(nx, ny)];
      if (tile && tile.type === 'wall') return;
      if (nx === stand.x && ny === stand.y) {
        setMessage('This is your lemonade stand. Press E to go in!');
      }

      pushHistory();
      state.x = nx;
      state.y = ny;
      updateCamera();

      const now = Date.now();
      if (now - state.lastStep > 240) {
        state.lastStep = now;
        playFootstep();
      }

      setMessage(state.inStand ? 'You are inside the lemonade stand.' : 'You moved.');
      render();
    }

    function placeAt(x, y) {
      if (!ok(x, y)) return;
      if (x === state.x && y === state.y) {
        setMessage('You cannot build on top of yourself.');
        return;
      }
      if (x === stand.x && y === stand.y) {
        setMessage('You cannot replace the lemonade stand.');
        return;
      }
      if (state.blocks[idx(x, y)]) {
        setMessage('That tile is already filled.');
        return;
      }

      pushHistory();
      state.blocks[idx(x, y)] = { type: state.selected };
      setMessage(`${state.selected} placed.`);
      render();
    }

    function removeAt(x, y) {
      if (!ok(x, y)) return;
      if (x === state.x && y === state.y) return;
      if (x === stand.x && y === stand.y) {
        setMessage('The lemonade stand cannot be removed.');
        return;
      }
      if (!state.blocks[idx(x, y)]) return;

      pushHistory();
      state.blocks[idx(x, y)] = null;
      setMessage('Block removed.');
      render();
    }

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      state.hover = screenToTile(x, y);
      render();
    });

    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      const tile = screenToTile(x, y);
      if (tile) placeAt(tile.x, tile.y);
    });

    canvas.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      const tile = screenToTile(x, y);
      if (tile) removeAt(tile.x, tile.y);
    });

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();

      if (key === 'e') {
        if (event.target && ['INPUT', 'TEXTAREA'].includes(event.target.tagName)) return;
        event.preventDefault();
        if (state.inStand) {
          buyUpgrade();
        } else if (nearStand()) {
          enterStand();
        } else {
          setMessage('Walk to the lemonade stand and press E to go inside.');
        }
        return;
      }

      const moves = {
        arrowup: [0, -1],
        arrowdown: [0, 1],
        arrowleft: [-1, 0],
        arrowright: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
      };

      if (!moves[key]) return;
      event.preventDefault();
      move(...moves[key]);
    });

    document.querySelectorAll('.tool').forEach((button) => {
      button.addEventListener('click', () => {
        state.selected = button.dataset.type;
        setMessage(`${state.selected} selected.`);
        document.querySelectorAll('.tool').forEach((el) => {
          el.classList.toggle('active', el === button);
        });
      });
    });

    undoBtn.addEventListener('click', undo);

    canvas.addEventListener('dblclick', () => {
      state.day += 1;
      setMessage(`Day ${state.day}: the town keeps growing.`);
      render();
    });

    window.addEventListener('pointerdown', () => {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx && !state.audioCtx) {
        state.audioCtx = new AudioCtx();
      }
    }, { once: true });

    setInterval(() => {
      if (state.inStand) {
        state.money += getMoneyRate();
        setMessage(`Inside the stand. You are earning $${getMoneyRate()}/s.`);
        render();
      }
    }, 1000);

    updateCamera();
    render();
  </script>
</body>
</html>
